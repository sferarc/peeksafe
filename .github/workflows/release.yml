name: Release

# A merged version bump publishes itself. Every push to main asks whether
# package.json names a version that CHANGELOG.md has a section for and npm does
# not list; only then does it publish and tag that commit. Any other push to
# main publishes nothing.
#
# main only takes pull requests, so the version bump goes through one:
#
#   pnpm version patch|minor|major --no-git-tag-version
#       bumps package.json, and the `version` script moves CHANGELOG.md's
#       Unreleased section under the new version
#   commit those two files, open a pull request, merge it
#
# Nobody pushes a tag: this workflow creates the annotated vX.Y.Z tag on the
# commit it published. A publish that failed is retried by re-running the
# failed jobs, or by the next push to main.
on:
  push:
    branches: [main]

permissions:
  contents: read

# Two pushes landing close together must not both reach npm publish.
concurrency:
  group: release
  cancel-in-progress: false

# Actions are pinned to full commit SHAs because the sferarc organisation
# requires it. A version tag is mutable, so a tag pin trusts whoever can move
# the tag. Update the SHA and the trailing comment together.

jobs:
  check:
    name: Is this a release
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.pending.outputs.release }}
      version: ${{ steps.pending.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1

      # A registry error fails this step instead of reading as "not published".
      - name: Version bumped and not on npm
        id: pending
        run: |
          set -euo pipefail
          PUBLISHED="$(npm view peeksafe versions --json)"
          node scripts/release-pending.mjs "$PUBLISHED"

  publish:
    name: Publish to npm
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance. It lets npm attest that this tarball was
      # built by this workflow from this commit, which is the only part of the
      # supply chain a consumer can check without trusting us.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node and pnpm come from mise.toml, checked against mise.lock.
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1

      - run: pnpm install --frozen-lockfile

      # An advisory published since the pull request's run blocks the release.
      - name: Runtime advisories
        run: pnpm audit --prod --audit-level high

      # The full CI gate again rather than trusting the pull request's run:
      # a squash merge produces a commit CI on the pull request never saw.
      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Same assertion CI makes on every pull request. A release is the worst
      # place to discover a runtime dependency arrived.
      - name: No runtime dependencies
        run: |
          set -euo pipefail
          pnpm pack
          TARBALL="$(ls peeksafe-*.tgz)"
          WORK="$(mktemp -d)"
          pnpm --dir "$WORK" init > /dev/null
          pnpm --dir "$WORK" add "$GITHUB_WORKSPACE/$TARBALL" --silent
          TREE="$(pnpm --dir "$WORK" ls --prod --depth Infinity --parseable | wc -l)"
          pnpm --dir "$WORK" ls --prod --depth Infinity
          if [ "$TREE" -ne 2 ]; then
            echo "::error title=Runtime dependency added::the packed tarball resolves $TREE packages, expected 2"
            exit 1
          fi
          # npm cannot resolve a `catalog:` specifier, so pnpm must have
          # replaced every one in the packed manifest.
          if tar -xzOf "$TARBALL" package/package.json | grep -q '"catalog:'; then
            echo "::error title=Unresolved catalog::the packed package.json still names a catalog: version"
            exit 1
          fi

      # npm, not pnpm, for the registry calls from here on: these are the
      # steps that only run on a release, so nothing exercises them before
      # one, and npm is the client npm documents trusted publishing for.
      #
      # Checked again because a publish can land between the check job and
      # this one, and npm would answer with a 403 that reads like an auth
      # problem.
      - name: Version is not already published
        run: |
          set -euo pipefail
          PKG="$(node -p 'require("./package.json").version')"
          if npm view "peeksafe@$PKG" version > /dev/null 2>&1; then
            echo "::error title=Already published::peeksafe@$PKG is already on the registry"
            exit 1
          fi

      # Trusted publishing needs npm 11.5.1 or newer. The npm bundled with the
      # Node in mise.toml is the one used, so this fails loudly if a Node bump
      # ever brings an older one.
      - name: npm new enough for trusted publishing
        run: |
          set -euo pipefail
          npm --version
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) process.exit(1);
          ' "$(npm --version)" || {
            echo "::error title=npm too old::trusted publishing needs npm 11.5.1 or newer"
            exit 1
          }

      # Trusted publishing only: no token, no ~/.npmrc. npm exchanges the
      # GitHub OIDC token granted by `id-token: write` above for a short-lived
      # publish credential, which works once npmjs.com -> peeksafe -> Settings
      # -> Trusted Publisher names this repository and this workflow file.
      #
      # npm cannot configure a trusted publisher for a package that does not
      # exist yet, so the first release is a manual `npm publish` by the owner
      # (brain/development/release.md). Without the trusted publisher this
      # fails here with an auth error, by design.
      #
      # It publishes the tarball pnpm packed and the step above checked. Run on
      # the directory, npm would pack its own and ship `catalog:` specifiers.
      - name: Publish
        run: |
          set -euo pipefail
          TARBALL="$(ls peeksafe-*.tgz)"
          npm publish "./$TARBALL" --provenance --access public

  # Tagged after the publish, so a vX.Y.Z tag always names a version npm has.
  # A tag pushed with GITHUB_TOKEN starts no other workflow.
  tag:
    name: Tag the release
    needs: [check, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Push annotated tag
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          # The last match is the peeled commit when the tag is annotated.
          EXISTING="$(git ls-remote --tags origin | awk -v t="refs/tags/$TAG" '$2 == t || $2 == t "^{}" { c = $1 } END { print c }')"
          if [ "$EXISTING" = "$GITHUB_SHA" ]; then
            echo "$TAG is already on $GITHUB_SHA"
            exit 0
          fi
          if [ -n "$EXISTING" ]; then
            echo "::error title=Tag exists::$TAG is on $EXISTING, but npm has $VERSION from $GITHUB_SHA"
            exit 1
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            tag -a "$TAG" -m "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
