name: Release

# Publishing is deliberately manual: push a tag when you mean it. Nothing here
# fires on a merge to main, so a release is always something a person decided.
#
# main only takes pull requests, so the version bump goes through one:
#
#   pnpm version patch|minor|major --no-git-tag-version
#       bumps package.json, and the `version` script moves CHANGELOG.md's
#       Unreleased section under the new version
#   commit those two files, open a pull request, merge it
#   git tag -a vX.Y.Z -m vX.Y.Z <merge commit> && git push origin vX.Y.Z
#
on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Actions are pinned to full commit SHAs because the sferarc organisation
# requires it. A version tag is mutable, so a tag pin trusts whoever can move
# the tag. Update the SHA and the trailing comment together.

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance. It lets npm attest that this tarball was
      # built by this workflow from this commit, which is the only part of the
      # supply chain a consumer can check without trusting us.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node and pnpm come from mise.toml, checked against mise.lock.
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1

      - run: pnpm install --frozen-lockfile

      # The tag is the thing a human typed and package.json is the thing npm
      # publishes under. They disagree exactly often enough to be worth a gate:
      # a tag pushed before `pnpm version` ran publishes the previous version
      # under a new tag, and nothing downstream ever notices.
      - name: Tag matches package.json version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error title=Version mismatch::tag is v$TAG, package.json is $PKG"
            exit 1
          fi
          echo "publishing $PKG"

      # The full CI gate again rather than trusting the run on main. A tag can
      # point at any commit, including one CI never saw.
      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Same assertion CI makes on every pull request. A release is the worst
      # place to discover a runtime dependency arrived.
      - name: No runtime dependencies
        run: |
          set -euo pipefail
          pnpm pack
          TARBALL="$(ls peeksafe-*.tgz)"
          WORK="$(mktemp -d)"
          pnpm --dir "$WORK" init > /dev/null
          pnpm --dir "$WORK" add "$GITHUB_WORKSPACE/$TARBALL" --silent
          TREE="$(pnpm --dir "$WORK" ls --prod --depth Infinity --parseable | wc -l)"
          pnpm --dir "$WORK" ls --prod --depth Infinity
          if [ "$TREE" -ne 2 ]; then
            echo "::error title=Runtime dependency added::the packed tarball resolves $TREE packages, expected 2"
            exit 1
          fi
          # npm cannot resolve a `catalog:` specifier, so pnpm must have
          # replaced every one in the packed manifest.
          if tar -xzOf "$TARBALL" package/package.json | grep -q '"catalog:'; then
            echo "::error title=Unresolved catalog::the packed package.json still names a catalog: version"
            exit 1
          fi

      # npm, not pnpm, for the registry calls from here on: these are the
      # steps that only run on a tag, so nothing exercises them before a
      # release, and npm is the client npm documents trusted publishing for.
      #
      # Refuse to republish a version that already exists, rather than letting
      # npm answer with a 403 that reads like an auth problem.
      - name: Version is not already published
        run: |
          set -euo pipefail
          PKG="$(node -p 'require("./package.json").version')"
          if npm view "peeksafe@$PKG" version > /dev/null 2>&1; then
            echo "::error title=Already published::peeksafe@$PKG is already on the registry"
            exit 1
          fi

      # Trusted publishing needs npm 11.5.1 or newer. The npm bundled with the
      # Node in mise.toml is the one used, so this fails loudly if a Node bump
      # ever brings an older one.
      - name: npm new enough for trusted publishing
        run: |
          set -euo pipefail
          npm --version
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) process.exit(1);
          ' "$(npm --version)" || {
            echo "::error title=npm too old::trusted publishing needs npm 11.5.1 or newer"
            exit 1
          }

      # Two ways in, on purpose, because they become available in that order.
      #
      # npm cannot configure a trusted publisher for a package that does not
      # exist yet, so the first release is a manual `npm publish` from a laptop.
      # After that, npmjs.com → peeksafe → Settings → Trusted Publisher, naming
      # this repository and this workflow file, and CI can publish with no token
      # at all: `id-token: write` above is what it uses.
      #
      # `NPM_TOKEN` stays as the fallback so this workflow works before that
      # switch is flipped as well as after. npm prefers OIDC when a trusted
      # publisher is configured and the token is then unused. Remove it once
      # you have seen a green release without it, not before.
      #
      # actions/setup-node used to write the auth line below through its
      # `registry-url` input. mise-action does not, so the step writes the same
      # line itself, only when the secret is set.
      #
      # It publishes the tarball pnpm packed and the step above checked. Run on
      # the directory, npm would pack its own and ship `catalog:` specifiers.
      - name: Publish
        run: |
          set -euo pipefail
          TARBALL="$(ls peeksafe-*.tgz)"
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            # Literal on purpose: npm expands the variable when it reads .npmrc,
            # so the token never reaches the file or the log.
            # shellcheck disable=SC2016
            echo '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' >> "$HOME/.npmrc"
          fi
          npm publish "./$TARBALL" --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
