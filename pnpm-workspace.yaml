allowBuilds:
  # lefthook's postinstall fetches its binary.
  lefthook: true

# Advisories the CI audit accepts. One GHSA per entry, with a comment giving the
# reason and the condition that ends the exception. `pnpm audit --ignore` writes
# here without a reason, so edit this list by hand.
auditConfig:
  ignoreGhsas: []

catalog:
  '@biomejs/biome': 2.5.15
  # Held at the oldest Node in `engines` so the types cannot offer an API that a
  # supported runtime lacks. Move it when `engines.node` moves.
  '@types/node': 22.20.5
  knip: 6.39.0
  lefthook: 2.1.16
  typescript: 7.0.2
  vitest: 5.0.3

catalogMode: strict
